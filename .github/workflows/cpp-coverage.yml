---
name: C/C++ CI Coverage

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: C/C++ CMake CI Coverage
    runs-on: ubuntu-26.04

    env:
      VCPKG_VERSION: 2026.10.16
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_VERSION }}
          path: vcpkg

      - name: Install/Adjust VCPKG
        shell: bash
        run: |
          export VCPKG_VERSION=${{ env.VCPKG_VERSION }}
          export VCPKG_ROOT="$GITHUB_WORKSPACE/vcpkg"
          sh "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          echo "$VCPKG_ROOT" >> "$GITHUB_PATH"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Install Tools
        run: |
          pip install --only-binary :all: gcovr==8.6

      - name: Check Tools
        run: |
          export PATH="$VCPKG_ROOT:$PATH"
          echo "-----------"
          gcc --version
          echo "-----------"
          make --version
          echo "-----------"
          cmake --version
          echo "-----------"
          vcpkg --version
          echo "-----------"
          gcovr --version

      - name: Install dependencies
        run: |
          export PATH="$VCPKG_ROOT:$PATH"
          make dependencies

      - name: Build
        run: make build

      - name: Test / Coverage
        run: make coverage/test

      # yamllint disable rule:line-length
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        # yamllint enable rule:line-length
        with:
          directory: ./coverage
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)
