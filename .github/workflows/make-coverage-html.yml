# yamllint disable rule:line-length
# This workflow runs make coverage/html and verifies that the coverage HTML report is generated.
# yamllint enable rule:line-length

---
name: Make Coverage HTML

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-coverage-html:
    name: "Run make coverage/html and verify coverage HTML"
    runs-on: ubuntu-26.04

    env:
      VCPKG_VERSION: 2026.10.16
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_VERSION }}
          path: vcpkg

      - name: Install/Adjust VCPKG
        shell: bash
        run: |
          export VCPKG_VERSION=${{ env.VCPKG_VERSION }}
          export VCPKG_ROOT="$GITHUB_WORKSPACE/vcpkg"
          sh "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          echo "$VCPKG_ROOT" >> "$GITHUB_PATH"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Install Tools
        run: |
          pip install --only-binary :all: gcovr==8.6

      - name: Check Tools
        run: |
          export PATH="$VCPKG_ROOT:$PATH"
          echo "-----------"
          make --version
          echo "-----------"
          cmake --version
          echo "-----------"
          vcpkg --version
          echo "-----------"
          gcovr --version
          echo "-----------"

      - name: Build
        run: |
          export PATH="$VCPKG_ROOT:$PATH"
          make build

      - name: Run tests (collect coverage)
        run: |
          make test-no-deps

      - name: Make coverage HTML report
        run: |
          make coverage/html

      - name: Verify coverage HTML artifact
        shell: bash
        run: |
          if [ ! -f coverage/index.html ]; then
            echo "Coverage HTML file not found: coverage-report/index.html"
            exit 1
          fi
          if [ ! -s coverage/index.html ]; then
            echo "Coverage HTML file is empty: coverage-report/index.html"
            exit 1
          fi

      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
