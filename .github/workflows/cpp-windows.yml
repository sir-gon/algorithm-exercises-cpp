---
name: C/C++ CMake/MSVC Windows CI Test

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: C/C++ CMake CI Test
    strategy:
      matrix:
        os:
          - "windows-11-arm"
          - "windows-2025"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install
        shell: bash
        run: |
          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Check MSVC
        shell: cmd
        run: |
          where cl
          cl
          where link
          where ml64

      - name: Check Tools
        run: |
          echo "-----------"
          c++ --version
          echo "-----------"
          make --version
          echo "-----------"
          cmake --version
          echo "-----------"
          vcpkg --version
          echo "-----------"

      - name: Install dependencies
        run: |
          vcpkg --x-wait-for-lock integrate install
          vcpkg --x-wait-for-lock install

      - name: Pre Build
        run: >
          cmake.exe
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -S${{ github.workspace }}
          -B${{ github.workspace }}/build/default -G "MinGW Makefiles"

      - name: Build
        run: |
          cmake --build build/default

      - name: Test
        run: >
          ctest
          -C Debug
          -T test
          --rerun-failed
          --output-on-failure
          --test-dir ${{ github.workspace }}/build/default
