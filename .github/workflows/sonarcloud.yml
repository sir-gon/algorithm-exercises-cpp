---
name: SonarCloud

# yamllint disable rule:line-length

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: SonarCloud build and run sonar-scanner
    runs-on: ubuntu-26.04
    env:
      # Directory where build-wrapper output will be placed
      BUILD_WRAPPER_OUT_DIR: build
      VCPKG_VERSION: 2026.10.16
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0

      - name: Checkout vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_VERSION }}
          path: vcpkg

      - name: Install/Adjust VCPKG
        shell: bash
        run: |
          export VCPKG_VERSION=${{ env.VCPKG_VERSION }}
          export VCPKG_ROOT="$GITHUB_WORKSPACE/vcpkg"
          sh "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          echo "$VCPKG_ROOT" >> "$GITHUB_PATH"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Install Tools
        run: |
          pip install --only-binary :all: gcovr==8.6

      - name: Check Tools
        run: |
          echo "-----------"
          cc --version
          echo "-----------"
          gcc --version
          echo "-----------"
          g++ --version
          echo "-----------"
          make --version
          echo "-----------"
          cmake --version
          echo "-----------"
          vcpkg --version
          echo "-----------"
          gcov --version
          echo "-----------"
          gcovr --version

      - name: Install dependencies
        run: |
          export PATH="$VCPKG_ROOT:$PATH"
          make dependencies

      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@d209202bc7d53ff1cc128f7f907dac145c9d6ae9

      - name: Run build-wrapper
        run: |
          export PATH="$VCPKG_ROOT:$PATH"
          build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} make build

      - name: Make coverage report
        run: |
          make coverage/test

      - name: Analyze with SonarQube / SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Consult https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/scanners/sonarscanner/ for more information and options
          args: >
            --define sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
            --define sonar.coverageReportPaths=coverage/coverage.xml
