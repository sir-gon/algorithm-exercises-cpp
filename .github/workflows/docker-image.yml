  #         sarif_file: 'snyk.sarif'
  # yamllint enable rule:line-length

  scan:
    name: "Trivy (${{ matrix.base_image }})"
    runs-on: ubuntu-26.04
    needs: [setup, build-prod]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}_${{ matrix.base_image }}_prod
          path: /tmp/

      - name: Load image
        env:
          # yamllint disable-line rule:line-length
          ARTIFACT_FILE: "${{ env.ARTIFACT_NAME }}_${{ matrix.base_image }}_prod.tar"
        run: |
          docker load --input /tmp/${{ env.ARTIFACT_FILE }}
          docker image ls -a

      - name: Run Trivy vulnerability scanner (cli report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # yamllint disable-line rule:line-length
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.base_image }}
          format: "table"
        env:
          TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}

      - name: Run Trivy vulnerability scanner (sarif report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # yamllint disable-line rule:line-length
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.base_image }}
          format: "sarif"
          output: "trivy-results-${{ matrix.base_image }}.sarif"
        env:
          TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results-${{ matrix.base_image }}.sarif"
